services:
  - type: web
    name: airlibrary-bot
    env: node
    nodeVersion: 18
    buildCommand: npm install && npm install crypto-browserify stream-browserify && echo "global.crypto = require('crypto');" > crypto-fix.js && node patch-baileys.js
    startCommand: node --require ./crypto-fix.js index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
        # This should be the base64-encoded JSON service account key with Firestore, Sheets, and Drive permissions
      - key: WHATSAPP_BOT_NUMBER
        sync: false
      - key: MASTER_SHEET_ID
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: WHATSAPP_AUTH_STATE
        sync: false
      - key: NODE_OPTIONS
        value: "--openssl-legacy-provider"
    healthCheckPath: /health
    autoDeploy: true 